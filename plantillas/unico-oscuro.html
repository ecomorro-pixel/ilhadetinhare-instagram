<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Public Sans",sans-serif}
.bagel{font-family:"Bagel Fat One",sans-serif;font-weight:400}
.accent{color:#DF8447}
.track{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(238,231,196,.15)}
.bar{position:absolute;bottom:0;left:0;height:6px;background:#D8724D;width:{{progreso}}}
.oscuro{background:linear-gradient(160deg,#4A3229 0%,#5B3E34 55%,#402C24 100%)}
</style>
</head>
<body>
<!-- Post único, foto completa con texto abajo (formato más usado de la cuenta). Campos: intro, title, cierre, photo, alt, foco (opcional). -->
<img src="{{photo}}" alt="{{alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{foco}}">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,14,.15) 0%,rgba(30,20,14,.45) 45%,rgba(30,20,14,.88) 100%)"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:72px 88px 64px">
<div style="display:flex;align-items:center;gap:18px"><span style="font-size:19px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(238,231,196,.85);white-space:nowrap">Ilha de Tinharé</span><span style="flex:1;height:1px;background:rgba(238,231,196,.2)"></span></div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:28px">
<p style="font-size:26px;line-height:1.5;color:rgba(248,247,240,.8)">{{intro}}</p>
<p class="bagel" style="font-size:58px;line-height:1.25;color:#F8F7F0">{{title}}</p>
<p style="font-size:30px;line-height:1.45;color:#EEE7C4">{{cierre}}</p>
</div>
<div style="padding-top:34px;font-size:17px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(238,231,196,.75)">Morro de São Paulo · Bahia</div>
</div>
</body>
</html>
