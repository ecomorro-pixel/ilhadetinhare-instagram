<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Public Sans",sans-serif}
.bagel{font-family:"Bagel Fat One",sans-serif;font-weight:400}
.accent{color:#DF8447}
.track{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(238,231,196,.15)}
.bar{position:absolute;bottom:0;left:0;height:6px;background:#D8724D;width:{{progreso}}}
.oscuro{background:linear-gradient(160deg,#4A3229 0%,#5B3E34 55%,#402C24 100%)}
</style>
</head>
<body>
<!-- Post único tipo guía: foto arriba con fundido y texto sobre crema. Campos: text, punch, photo, alt, foco (opcional). -->
<div style="position:absolute;inset:0;background:linear-gradient(175deg,#FBF8F1 0%,#F8F7F0 55%,#EEE7C4 100%)"></div>
<div style="position:absolute;top:0;left:0;right:0;height:660px;overflow:hidden">
<img src="{{photo}}" alt="{{alt}}" style="width:100%;height:100%;object-fit:cover;object-position:{{foco}}">
<div style="position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(to bottom,transparent,#F8F7F0)"></div>
</div>
<div style="position:absolute;left:96px;right:96px;top:640px;bottom:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:30px">
<div style="display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border:1px solid rgba(91,62,52,.3);border-radius:999px;background:rgba(238,231,196,.5)">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7.9 2 4.5 5.4 4.5 9.5c0 5.3 6.4 11.6 6.9 12.1a.85.85 0 0 0 1.2 0c.5-.5 6.9-6.8 6.9-12.1C19.5 5.4 16.1 2 12 2z" fill="#5B3E34"/><circle cx="12" cy="9.5" r="3" fill="#F8F7F0"/></svg>
<span style="font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#5B3E34">Morro de São Paulo · Bahia</span></div>
<p style="font-size:32px;line-height:1.5;color:#5B3E34">{{text}}</p>
<p class="bagel" style="font-size:46px;line-height:1.3;color:#D8724D">{{punch}}</p>
</div>
<div style="position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:17px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(91,62,52,.85)">Ilha de Tinharé</div>
</body>
</html>
