<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Public Sans",sans-serif}
.bagel{font-family:"Bagel Fat One",sans-serif;font-weight:400}
.accent{color:#DF8447}
.track{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(238,231,196,.15)}
.bar{position:absolute;bottom:0;left:0;height:6px;background:#D8724D;width:{{progreso}}}
.oscuro{background:linear-gradient(160deg,#4A3229 0%,#5B3E34 55%,#402C24 100%)}
</style>
</head>
<body>
<!-- Lámina de contenido con foto arriba y texto sobre crema. Campos: num, label, title, body, photo, alt, foco (opcional). -->
<div style="position:absolute;inset:0;background:linear-gradient(175deg,#FBF8F1 0%,#F8F7F0 55%,#EEE7C4 100%)"></div>
<div style="position:absolute;top:0;left:0;right:0;height:640px;overflow:hidden">
<img src="{{photo}}" alt="{{alt}}" style="width:100%;height:100%;object-fit:cover;object-position:{{foco}}">
<div style="position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(to bottom,transparent,#F8F7F0)"></div>
</div>
<div style="position:absolute;left:96px;right:96px;top:640px;bottom:110px;display:flex;flex-direction:column;justify-content:center;gap:26px">
<div style="display:flex;align-items:baseline;gap:22px"><span class="bagel" style="font-size:64px;color:#D8724D;line-height:1">{{num}}</span><span style="font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#5B3E34">{{label}}</span></div>
<h2 class="bagel" style="font-size:50px;line-height:1.25;color:#5B3E34">{{title}}</h2>
<p style="font-size:30px;line-height:1.5;color:#5B3E34">{{body}}</p>
</div>
<div style="position:absolute;left:96px;bottom:56px;font-size:17px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(91,62,52,.85)">Ilha de Tinharé</div>
<div class="track" style="background:rgba(91,62,52,.12)"></div><div class="bar"></div>
</body>
</html>
