<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Public Sans",sans-serif}
.bagel{font-family:"Bagel Fat One",sans-serif;font-weight:400}
.accent{color:#DF8447}
.track{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(238,231,196,.15)}
.bar{position:absolute;bottom:0;left:0;height:6px;background:#D8724D;width:{{progreso}}}
.oscuro{background:linear-gradient(160deg,#4A3229 0%,#5B3E34 55%,#402C24 100%)}
</style>
</head>
<body>
<!-- Portada de carrusel. Campos: label, title, subtitle, photo, alt, foco (opcional). *palabra* = acento. -->
<img src="{{photo}}" alt="{{alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{foco}}">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,14,.20) 0%,rgba(30,20,14,.50) 45%,rgba(30,20,14,.90) 100%)"></div>
<div style="position:absolute;left:90px;right:90px;bottom:150px">
<div style="font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(238,231,196,.85);margin-bottom:36px">{{label}}</div>
<h1 class="bagel" style="font-size:76px;line-height:1.15;color:#F8F7F0;letter-spacing:-.5px">{{title}}</h1>
<p style="margin-top:30px;font-size:30px;line-height:1.45;color:rgba(248,247,240,.85)">{{subtitle}}</p>
<div style="margin-top:44px;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#EEE7C4">Swipe
<svg width="40" height="24" viewBox="0 0 40 24" fill="none" stroke="#EEE7C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h34M26 3l10 9-10 9"></path></svg></div>
</div>
<div class="track"></div><div class="bar"></div>
</body>
</html>
