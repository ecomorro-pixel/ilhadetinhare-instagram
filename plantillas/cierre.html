<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Public Sans",sans-serif}
.bagel{font-family:"Bagel Fat One",sans-serif;font-weight:400}
.accent{color:#DF8447}
.track{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(238,231,196,.15)}
.bar{position:absolute;bottom:0;left:0;height:6px;background:#D8724D;width:{{progreso}}}
.oscuro{background:linear-gradient(160deg,#4A3229 0%,#5B3E34 55%,#402C24 100%)}
</style>
</head>
<body>
<!-- Lámina final con CTA y contacto fijo. Campos: title, body. -->
<div class="oscuro" style="position:absolute;inset:0"></div>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:960px;height:800px;background:radial-gradient(ellipse,rgba(216,114,77,.18) 0%,transparent 65%)"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 110px;gap:40px">
<div style="font-size:26px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#EEE7C4">Ilha de Tinharé</div>
<h2 class="bagel" style="font-size:54px;line-height:1.3;color:#F8F7F0">{{title}}</h2>
<p style="font-size:30px;line-height:1.5;color:rgba(248,247,240,.8)">{{body}}</p>
<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:34px;font-weight:700;color:#D8724D">WhatsApp +55 75 99715-4100</div>
<div style="font-size:24px;font-weight:500;letter-spacing:1.5px;color:rgba(248,247,240,.65)">@ilhadetinhare · link in bio</div>
</div>
</div>
<div class="track"></div><div class="bar"></div>
</body>
</html>
